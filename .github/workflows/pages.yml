# Builds the wallpaper catalog and publishes the site to https://crywall.github.io
# Runs on every push and every night, so the site stays fresh without any PC turned on.
name: Yayinla

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'   # every night 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the version number is the commit count
      - name: Restore phone thumbnails made on earlier nights
        uses: actions/cache@v4
        with:
          path: public/t
          key: phone-thumbs-${{ github.run_id }}
          restore-keys: phone-thumbs-
      - name: Make sure ffmpeg is installed (used to make phone thumbnails)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Build wallpaper catalog
        shell: pwsh
        run: ./tools/build-catalog.ps1
      - name: Write version (shown in the corner of the site)
        run: |
          echo "{\"v\":\"1.$(git rev-list --count HEAD)\",\"sha\":\"$(git rev-parse --short HEAD)\",\"date\":\"$(git log -1 --format=%cs)\"}" > public/version.json
          cat public/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

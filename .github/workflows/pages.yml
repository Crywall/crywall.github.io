# Builds the wallpaper catalog and publishes the site to https://crywall.github.io
# Runs on every push and every night, so the site stays fresh without any PC turned on.
name: Yayinla

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'   # every night 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the version number is the commit count
      - name: Restore thumbnails and the catalog made on earlier runs
        uses: actions/cache@v4
        with:
          path: |
            public/t
            public/data
          key: site-data-${{ github.run_id }}
          restore-keys: |
            site-data-
            phone-thumbs-
      # The full catalog rebuild takes 15+ minutes. Normal pushes reuse the last catalog
      # (publishes in ~1-2 min); it is rebuilt every night, by hand, or when tools/ changed.
      - name: Decide whether to rebuild the catalog
        id: need
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ ! -f public/data/index.json ] || git diff --name-only ${{ github.event.before }} HEAD 2>/dev/null | grep -q '^tools/' || ! git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            echo "build=yes" >> "$GITHUB_OUTPUT"; echo "catalog: rebuild"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "catalog: reuse last one"
          fi
      - name: Make sure ffmpeg is installed (used to make phone thumbnails)
        if: steps.need.outputs.build == 'yes'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Build wallpaper catalog
        if: steps.need.outputs.build == 'yes'
        shell: pwsh
        run: ./tools/build-catalog.ps1
      - name: Write version (shown in the corner of the site)
        run: |
          echo "{\"v\":\"1.$(git rev-list --count HEAD)\",\"sha\":\"$(git rev-parse --short HEAD)\",\"date\":\"$(git log -1 --format=%cs)\"}" > public/version.json
          cat public/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

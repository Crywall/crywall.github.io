# Builds the wallpaper catalog and publishes the site to https://crywall.github.io
# Runs on every push and every night, so the site stays fresh without any PC turned on.
name: Yayinla

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'   # every night 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wallpaper catalog
        shell: pwsh
        run: ./tools/build-catalog.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
